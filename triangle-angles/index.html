<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각형 내각의 합 = 180°</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #ffffff;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 1.3rem; margin-bottom: 6px; color: #222; }
  .subtitle { font-size: 0.85rem; color: #999; margin-bottom: 16px; }
  canvas {
    background: #fafafa;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }
  .info-box {
    margin-top: 16px;
    background: #fafafa;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
    padding: 16px 28px;
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .angle-display { text-align: center; min-width: 70px; }
  .angle-display .label { font-size: 0.8rem; margin-bottom: 4px; }
  .angle-display .value {
    font-size: 1.4rem;
    font-weight: bold;
    font-family: 'Courier New', monospace;
  }
  .sum-display {
    text-align: center;
    border-left: 1px solid #e0e0e0;
    padding-left: 20px;
  }
  .sum-display .label { font-size: 0.8rem; color: #999; margin-bottom: 4px; }
  .sum-display .value {
    font-size: 1.6rem;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    color: #d97706;
  }
  .bar-container {
    margin-top: 12px;
    background: #fafafa;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
    padding: 12px 28px;
    width: 560px;
    max-width: 100%;
  }
  .bar-label { font-size: 0.8rem; color: #999; margin-bottom: 6px; text-align: center; }
  .bar {
    height: 24px;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
  }
  .bar div {
    height: 100%;
    transition: width 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: bold;
    font-family: 'Courier New', monospace;
  }
</style>
</head>
<body>

<h1>삼각형 내각의 합 = 180°</h1>
<p class="subtitle">꼭짓점을 드래그해서 삼각형을 변형해보세요</p>
<canvas id="canvas" width="560" height="440"></canvas>

<div class="info-box">
  <div class="angle-display">
    <div class="label" style="color:#0d9488;">&#8736;A</div>
    <div class="value" style="color:#0d9488;" id="angleA">0°</div>
  </div>
  <div style="color:#ccc; font-size:1.3rem;">+</div>
  <div class="angle-display">
    <div class="label" style="color:#dc2626;">&#8736;B</div>
    <div class="value" style="color:#dc2626;" id="angleB">0°</div>
  </div>
  <div style="color:#ccc; font-size:1.3rem;">+</div>
  <div class="angle-display">
    <div class="label" style="color:#7c3aed;">&#8736;C</div>
    <div class="value" style="color:#7c3aed;" id="angleC">0°</div>
  </div>
  <div class="sum-display">
    <div class="label">합계</div>
    <div class="value" id="angleSum">180°</div>
  </div>
</div>

<div class="bar-container">
  <div class="bar-label">각도 비율</div>
  <div class="bar" id="angleBar"></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const COLOR_A = '#0d9488';
const COLOR_B = '#dc2626';
const COLOR_C = '#7c3aed';

let points = [
  { x: 140, y: 350, label: 'A', color: COLOR_A },
  { x: 420, y: 350, label: 'B', color: COLOR_B },
  { x: 280, y: 80,  label: 'C', color: COLOR_C }
];

let dragging = null;
const pointRadius = 12;

function angleBetween(p, a, b) {
  const v1x = a.x - p.x, v1y = a.y - p.y;
  const v2x = b.x - p.x, v2y = b.y - p.y;
  const dot = v1x * v2x + v1y * v2y;
  const cross = v1x * v2y - v1y * v2x;
  return Math.atan2(Math.abs(cross), dot) * (180 / Math.PI);
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawArc(center, p1, p2, color, radius) {
  const a1 = Math.atan2(p1.y - center.y, p1.x - center.x);
  const a2 = Math.atan2(p2.y - center.y, p2.x - center.x);
  let start = a1, end = a2;
  let diff = end - start;
  if (diff > Math.PI) start += 2 * Math.PI;
  if (diff < -Math.PI) end += 2 * Math.PI;
  const ccw = (end < start);

  ctx.beginPath();
  ctx.moveTo(center.x, center.y);
  ctx.arc(center.x, center.y, radius, start, end, ccw);
  ctx.closePath();
  ctx.fillStyle = hexToRgba(color, 0.12);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(center.x, center.y, radius, start, end, ccw);
  ctx.strokeStyle = hexToRgba(color, 0.6);
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const [A, B, C] = points;

  const angA = angleBetween(A, B, C);
  const angB = angleBetween(B, A, C);
  const angC = angleBetween(C, A, B);
  const sum = angA + angB + angC;

  // Angle arcs
  drawArc(A, B, C, A.color, 28);
  drawArc(B, A, C, B.color, 28);
  drawArc(C, A, B, C.color, 28);

  // Triangle fill
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.lineTo(C.x, C.y);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,0,0,0.02)';
  ctx.fill();

  // Triangle edges
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Points and labels
  points.forEach((p, i) => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, pointRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.fillStyle = p.color;
    ctx.font = 'bold 12px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(p.label, p.x, p.y + 4);

    // Angle near vertex
    const others = points.filter((_, j) => j !== i);
    const midX = (others[0].x + others[1].x) / 2;
    const midY = (others[0].y + others[1].y) / 2;
    const dx = midX - p.x, dy = midY - p.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const ox = (dx / dist) * 42;
    const oy = (dy / dist) * 42;
    const ang = [angA, angB, angC][i];
    ctx.fillStyle = p.color;
    ctx.font = '11px Courier New';
    ctx.fillText(ang.toFixed(1) + '°', p.x + ox, p.y + oy);
  });

  // Info displays
  document.getElementById('angleA').textContent = angA.toFixed(1) + '°';
  document.getElementById('angleB').textContent = angB.toFixed(1) + '°';
  document.getElementById('angleC').textContent = angC.toFixed(1) + '°';
  document.getElementById('angleSum').textContent = sum.toFixed(1) + '°';

  document.getElementById('angleBar').innerHTML =
    `<div style="width:${(angA/180)*100}%; background:${COLOR_A}; color:#fff;">${angA.toFixed(0)}°</div>` +
    `<div style="width:${(angB/180)*100}%; background:${COLOR_B}; color:#fff;">${angB.toFixed(0)}°</div>` +
    `<div style="width:${(angC/180)*100}%; background:${COLOR_C}; color:#fff;">${angC.toFixed(0)}°</div>`;
}

function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function hitTest(mouse, point) {
  const dx = mouse.x - point.x, dy = mouse.y - point.y;
  return Math.sqrt(dx*dx + dy*dy) < pointRadius + 10;
}

canvas.addEventListener('mousedown', (e) => {
  const m = getMousePos(e);
  for (const p of points) { if (hitTest(m, p)) { dragging = p; break; } }
});
canvas.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const m = getMousePos(e);
  dragging.x = Math.max(pointRadius, Math.min(canvas.width - pointRadius, m.x));
  dragging.y = Math.max(pointRadius, Math.min(canvas.height - pointRadius, m.y));
  draw();
});
canvas.addEventListener('mouseup', () => { dragging = null; });
canvas.addEventListener('mouseleave', () => { dragging = null; });

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0], rect = canvas.getBoundingClientRect();
  const m = { x: (t.clientX - rect.left) * (canvas.width / rect.width), y: (t.clientY - rect.top) * (canvas.height / rect.height) };
  for (const p of points) { if (hitTest(m, p)) { dragging = p; break; } }
});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!dragging) return;
  const t = e.touches[0], rect = canvas.getBoundingClientRect();
  const m = { x: (t.clientX - rect.left) * (canvas.width / rect.width), y: (t.clientY - rect.top) * (canvas.height / rect.height) };
  dragging.x = Math.max(pointRadius, Math.min(canvas.width - pointRadius, m.x));
  dragging.y = Math.max(pointRadius, Math.min(canvas.height - pointRadius, m.y));
  draw();
});
canvas.addEventListener('touchend', () => { dragging = null; });

draw();
</script>
</body>
</html>
