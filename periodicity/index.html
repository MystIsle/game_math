<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각함수의 주기성</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #ffffff;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 1.3rem; margin-bottom: 6px; color: #222; }
  .subtitle { font-size: 0.85rem; color: #999; margin-bottom: 16px; }
  .controls {
    display: flex;
    gap: 20px;
    margin-bottom: 16px;
    background: #fafafa;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
    padding: 10px 20px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: #555;
  }
  .control-group label { font-weight: 600; }
  .control-group input[type="range"] {
    width: 80px;
    accent-color: #7c3aed;
  }
  .control-group .val {
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    min-width: 32px;
    color: #7c3aed;
  }
  .btn {
    padding: 5px 14px;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 0.85rem;
    color: #555;
    transition: all 0.15s;
  }
  .btn:hover { background: #fafafa; border-color: #ccc; }
  .btn.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }
  canvas {
    background: #fafafa;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
  }
  .demo-section {
    margin-top: 16px;
    background: #fafafa;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
    padding: 16px 24px;
    width: 660px;
    max-width: 100%;
  }
  .demo-section h2 {
    font-size: 0.8rem;
    color: #999;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .demo-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 10px;
  }
  .demo-row:last-child { margin-bottom: 0; }
  .demo-label {
    font-size: 0.8rem;
    color: #888;
    width: 100px;
    text-align: right;
  }
  .demo-track {
    flex: 1;
    height: 32px;
    background: #eee;
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }
  .demo-object {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    transition: none;
  }
  .formula-hint {
    margin-top: 12px;
    font-size: 0.8rem;
    color: #999;
    font-family: 'Courier New', monospace;
    text-align: center;
  }
</style>
</head>
<body>

<h1>삼각함수의 주기성</h1>
<p class="subtitle">sin, cos는 -1 ~ 1 사이를 부드럽게 반복한다</p>

<div class="controls">
  <button class="btn active" id="btnPlay" onclick="togglePlay()">⏸ 일시정지</button>
  <div class="control-group">
    <label>속도</label>
    <input type="range" id="speedSlider" min="0.5" max="4" step="0.5" value="1">
    <span class="val" id="speedVal">1.0x</span>
  </div>
  <div class="control-group">
    <label>진폭</label>
    <input type="range" id="ampSlider" min="0.2" max="1" step="0.1" value="1">
    <span class="val" id="ampVal">1.0</span>
  </div>
</div>

<canvas id="canvas" width="660" height="320"></canvas>

<div class="demo-section">
  <h2>게임에서의 활용 예시</h2>
  <div class="demo-row">
    <div class="demo-label" style="color:#0d9488;">아이템 부유</div>
    <div class="demo-track">
      <div class="demo-object" id="floatObj" style="background:#0d9488;"></div>
    </div>
  </div>
  <div class="demo-row">
    <div class="demo-label" style="color:#2563eb;">좌우 순찰</div>
    <div class="demo-track">
      <div class="demo-object" id="patrolObj" style="background:#2563eb;"></div>
    </div>
  </div>
  <div class="demo-row">
    <div class="demo-label" style="color:#dc2626;">숨쉬기 모션</div>
    <div class="demo-track" style="display:flex; align-items:center; justify-content:center;">
      <div id="breathObj" style="background:#dc2626; border-radius:50%; transition:none;"></div>
    </div>
  </div>
  <div class="demo-row">
    <div class="demo-label" style="color:#d97706;">투명도 깜빡임</div>
    <div class="demo-track" style="display:flex; align-items:center; justify-content:center;">
      <div id="fadeObj" style="width:80px; height:24px; border-radius:4px; background:#d97706; transition:none;"></div>
    </div>
  </div>
  <div class="formula-hint" id="formulaHint">y = sin(t) → 부드러운 반복</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const COLOR_SIN = '#0d9488';
const COLOR_COS = '#2563eb';

const circleX = 100, circleY = 160, circleR = 80;
const waveStartX = 220, waveEndX = 640, waveY = 160, waveAmpBase = 80;

let t = 0;
let playing = true;

const speedSlider = document.getElementById('speedSlider');
const ampSlider = document.getElementById('ampSlider');

speedSlider.addEventListener('input', () => {
  document.getElementById('speedVal').textContent = parseFloat(speedSlider.value).toFixed(1) + 'x';
});
ampSlider.addEventListener('input', () => {
  document.getElementById('ampVal').textContent = parseFloat(ampSlider.value).toFixed(1);
});

function togglePlay() {
  playing = !playing;
  const btn = document.getElementById('btnPlay');
  btn.textContent = playing ? '⏸ 일시정지' : '▶ 재생';
  btn.classList.toggle('active', playing);
}

function draw() {
  const speed = parseFloat(speedSlider.value);
  const amp = parseFloat(ampSlider.value);
  const waveAmp = waveAmpBase * amp;

  if (playing) t += 0.02 * speed;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Unit circle
  ctx.beginPath();
  ctx.arc(circleX, circleY, circleR, 0, Math.PI * 2);
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Circle axes
  ctx.strokeStyle = '#eee';
  ctx.beginPath();
  ctx.moveTo(circleX - circleR - 10, circleY);
  ctx.lineTo(circleX + circleR + 10, circleY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(circleX, circleY - circleR - 10);
  ctx.lineTo(circleX, circleY + circleR + 10);
  ctx.stroke();

  // Rotating point on circle
  const px = circleX + circleR * Math.cos(t);
  const py = circleY - circleR * Math.sin(t);

  // Sin projection line (horizontal from circle to wave)
  const sinY = circleY - waveAmp * Math.sin(t);
  ctx.strokeStyle = 'rgba(13, 148, 136, 0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(waveStartX, sinY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Radius line
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(circleX, circleY);
  ctx.lineTo(px, py);
  ctx.stroke();

  // Sin vertical on circle
  ctx.strokeStyle = COLOR_SIN;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px, circleY);
  ctx.lineTo(px, py);
  ctx.stroke();

  // Cos horizontal on circle
  ctx.strokeStyle = COLOR_COS;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(circleX, circleY);
  ctx.lineTo(px, circleY);
  ctx.stroke();

  // Point on circle
  ctx.beginPath();
  ctx.arc(px, py, 6, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#d97706';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Wave area background
  // Horizontal center line for wave
  ctx.strokeStyle = '#eee';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(waveStartX, waveY);
  ctx.lineTo(waveEndX, waveY);
  ctx.stroke();

  // Y axis labels
  ctx.fillStyle = '#ccc';
  ctx.font = '10px Segoe UI';
  ctx.textAlign = 'right';
  ctx.fillText('1', waveStartX - 6, waveY - waveAmp + 3);
  ctx.fillText('0', waveStartX - 6, waveY + 3);
  ctx.fillText('-1', waveStartX - 6, waveY + waveAmp + 3);

  // Draw sin wave
  ctx.strokeStyle = COLOR_SIN;
  ctx.lineWidth = 2;
  ctx.beginPath();
  const waveLen = waveEndX - waveStartX;
  for (let i = 0; i <= waveLen; i++) {
    const wt = t - (i / waveLen) * Math.PI * 4;
    const wy = waveY - waveAmp * Math.sin(wt);
    if (i === 0) ctx.moveTo(waveStartX + i, wy);
    else ctx.lineTo(waveStartX + i, wy);
  }
  ctx.stroke();

  // Current point on wave
  ctx.beginPath();
  ctx.arc(waveStartX, sinY, 5, 0, Math.PI * 2);
  ctx.fillStyle = COLOR_SIN;
  ctx.fill();

  // Labels
  ctx.fillStyle = COLOR_SIN;
  ctx.font = 'bold 12px Segoe UI';
  ctx.textAlign = 'left';
  ctx.fillText('sin', waveStartX + 8, sinY - 8);

  // Current value
  ctx.fillStyle = '#333';
  ctx.font = '11px Courier New';
  ctx.textAlign = 'center';
  const deg = ((t * 180 / Math.PI) % 360).toFixed(0);
  ctx.fillText(`θ = ${deg}°`, circleX, circleY + circleR + 28);
  ctx.fillStyle = COLOR_SIN;
  ctx.fillText(`sin = ${Math.sin(t).toFixed(3)}`, circleX, circleY + circleR + 42);

  // Labels on circle
  ctx.fillStyle = '#ccc';
  ctx.font = '10px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('0°', circleX + circleR + 14, circleY + 4);
  ctx.fillText('90°', circleX, circleY - circleR - 6);
  ctx.fillText('180°', circleX - circleR - 16, circleY + 4);
  ctx.fillText('270°', circleX, circleY + circleR + 14);

  // Demo animations
  const sinT = Math.sin(t);
  const cosT = Math.cos(t);

  // Float (up-down using sin)
  const floatObj = document.getElementById('floatObj');
  const floatTrack = floatObj.parentElement;
  const floatRange = floatTrack.clientWidth - 28;
  floatObj.style.left = ((0.5 + sinT * amp * 0.45) * floatRange) + 'px';

  // Patrol (left-right using cos)
  const patrolObj = document.getElementById('patrolObj');
  const patrolTrack = patrolObj.parentElement;
  const patrolRange = patrolTrack.clientWidth - 28;
  patrolObj.style.left = ((0.5 + cosT * amp * 0.45) * patrolRange) + 'px';

  // Breathing (scale using sin)
  const breathObj = document.getElementById('breathObj');
  const breathScale = 18 + (sinT * amp + 1) * 6;
  breathObj.style.width = breathScale + 'px';
  breathObj.style.height = breathScale + 'px';

  // Fade (opacity using sin)
  const fadeObj = document.getElementById('fadeObj');
  fadeObj.style.opacity = 0.3 + (sinT * amp + 1) * 0.35;

  // Formula hint
  document.getElementById('formulaHint').textContent =
    `y = ${amp !== 1 ? amp.toFixed(1) + ' × ' : ''}sin(${speed !== 1 ? speed.toFixed(1) + ' × ' : ''}t) = ${(amp * sinT).toFixed(3)}`;

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
