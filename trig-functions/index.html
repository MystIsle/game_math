<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼각함수 - sin, cos, tan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #ffffff;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 1.3rem; margin-bottom: 6px; color: #222; }
  .subtitle { font-size: 0.85rem; color: #999; margin-bottom: 16px; }
  .controls {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    background: #fafafa;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
    padding: 10px 20px;
  }
  .control-item {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    font-size: 0.9rem;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  .control-item.off { opacity: 0.3; }
  .control-item input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border: 2px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
  }
  .control-item input[type="checkbox"]:checked {
    border-color: currentColor;
    background: currentColor;
  }
  .control-item input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    top: -1px;
    left: 2px;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
  }
  .main-container {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  canvas {
    background: #fafafa;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }
  .panel {
    background: #fafafa;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
    padding: 20px;
    min-width: 230px;
  }
  .angle-display {
    text-align: center;
    padding: 12px 0;
    margin-bottom: 12px;
    border-bottom: 1px solid #eee;
  }
  .angle-display .deg {
    font-size: 2rem;
    font-weight: bold;
    color: #222;
    font-family: 'Courier New', monospace;
  }
  .angle-display .rad {
    font-size: 0.8rem;
    color: #999;
    margin-top: 2px;
  }
  .func-section {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
    transition: opacity 0.2s;
  }
  .func-section:last-child { border-bottom: none; }
  .func-section.hidden { display: none; }
  .func-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .func-name {
    font-size: 0.95rem;
    font-weight: 700;
  }
  .func-value {
    font-family: 'Courier New', monospace;
    font-size: 1.2rem;
    font-weight: bold;
  }
  .func-formula {
    font-size: 0.8rem;
    color: #888;
    font-family: 'Courier New', monospace;
    margin-bottom: 2px;
  }
  .func-ratio {
    font-size: 0.78rem;
    color: #aaa;
    font-family: 'Courier New', monospace;
  }
  .legend {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #eee;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: #666;
    margin-bottom: 4px;
  }
  .legend-dot {
    width: 14px;
    height: 3px;
    border-radius: 2px;
  }
  .bar-section {
    margin-top: 16px;
    background: #fafafa;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
    padding: 16px 20px;
    width: 100%;
    max-width: 640px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    transition: opacity 0.2s;
  }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-row.hidden { display: none; }
  .bar-name {
    width: 36px;
    font-size: 0.8rem;
    font-weight: 600;
    text-align: right;
  }
  .bar-track {
    flex: 1;
    height: 18px;
    background: #eee;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.05s ease;
    position: absolute;
    left: 50%;
  }
  .bar-val {
    width: 52px;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    text-align: left;
  }
  .bar-center {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #ccc;
  }
</style>
</head>
<body>

<h1>sin, cos, tan</h1>
<p class="subtitle">점을 드래그해서 각도를 바꿔보세요</p>

<div class="controls">
  <label class="control-item" style="color:#0d9488;">
    <input type="checkbox" id="showSin" checked style="color:#0d9488;"> sin
  </label>
  <label class="control-item" style="color:#2563eb;">
    <input type="checkbox" id="showCos" style="color:#2563eb;"> cos
  </label>
  <label class="control-item" style="color:#dc2626;">
    <input type="checkbox" id="showTan" style="color:#dc2626;"> tan
  </label>
</div>

<div class="main-container">
  <canvas id="canvas" width="380" height="380"></canvas>
  <div class="panel">
    <div class="angle-display">
      <div class="deg" id="angleDeg">45°</div>
      <div class="rad" id="angleRad">0.785 rad</div>
    </div>

    <div class="func-section" id="sinSection">
      <div class="func-header">
        <span class="func-name" style="color:#0d9488;">sin θ</span>
        <span class="func-value" style="color:#0d9488;" id="sinVal">0.707</span>
      </div>
      <div class="func-formula">높이 / 빗변 (opposite / hypotenuse)</div>
      <div class="func-ratio" id="sinRatio"></div>
    </div>

    <div class="func-section hidden" id="cosSection">
      <div class="func-header">
        <span class="func-name" style="color:#2563eb;">cos θ</span>
        <span class="func-value" style="color:#2563eb;" id="cosVal">0.707</span>
      </div>
      <div class="func-formula">밑변 / 빗변 (adjacent / hypotenuse)</div>
      <div class="func-ratio" id="cosRatio"></div>
    </div>

    <div class="func-section hidden" id="tanSection">
      <div class="func-header">
        <span class="func-name" style="color:#dc2626;">tan θ</span>
        <span class="func-value" style="color:#dc2626;" id="tanVal">1.000</span>
      </div>
      <div class="func-formula">높이 / 밑변 (opposite / adjacent)</div>
      <div class="func-ratio" id="tanRatio"></div>
    </div>

    <div class="legend">
      <div class="legend-item" id="legendAdj" style="display:none;"><div class="legend-dot" style="background:#2563eb;"></div>밑변 (adjacent)</div>
      <div class="legend-item" id="legendOpp"><div class="legend-dot" style="background:#0d9488;"></div>높이 (opposite)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#d97706;"></div>빗변 (hypotenuse)</div>
    </div>
  </div>
</div>

<div class="bar-section">
  <div class="bar-row" id="sinBarRow">
    <div class="bar-name" style="color:#0d9488;">sin</div>
    <div class="bar-track"><div class="bar-center"></div><div class="bar-fill" id="sinBar" style="background:#0d9488;"></div></div>
    <div class="bar-val" id="sinBarVal" style="color:#0d9488;">0.707</div>
  </div>
  <div class="bar-row hidden" id="cosBarRow">
    <div class="bar-name" style="color:#2563eb;">cos</div>
    <div class="bar-track"><div class="bar-center"></div><div class="bar-fill" id="cosBar" style="background:#2563eb;"></div></div>
    <div class="bar-val" id="cosBarVal" style="color:#2563eb;">0.707</div>
  </div>
  <div class="bar-row hidden" id="tanBarRow">
    <div class="bar-name" style="color:#dc2626;">tan</div>
    <div class="bar-track"><div class="bar-center"></div><div class="bar-fill" id="tanBar" style="background:#dc2626;"></div></div>
    <div class="bar-val" id="tanBarVal" style="color:#dc2626;">1.000</div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const cx = 190, cy = 200;
const radius = 140;
let angle = Math.PI / 4;
let dragging = false;

const COLOR_ADJ = '#2563eb';
const COLOR_OPP = '#0d9488';
const COLOR_HYP = '#d97706';
const COLOR_TAN = '#dc2626';

const showSin = document.getElementById('showSin');
const showCos = document.getElementById('showCos');
const showTan = document.getElementById('showTan');

function updateVisibility() {
  const sin = showSin.checked;
  const cos = showCos.checked;
  const tan = showTan.checked;

  document.getElementById('sinSection').classList.toggle('hidden', !sin);
  document.getElementById('cosSection').classList.toggle('hidden', !cos);
  document.getElementById('tanSection').classList.toggle('hidden', !tan);
  document.getElementById('sinBarRow').classList.toggle('hidden', !sin);
  document.getElementById('cosBarRow').classList.toggle('hidden', !cos);
  document.getElementById('tanBarRow').classList.toggle('hidden', !tan);

  document.getElementById('legendOpp').style.display = (sin || tan) ? 'flex' : 'none';
  document.getElementById('legendAdj').style.display = (cos || tan) ? 'flex' : 'none';

  showSin.closest('.control-item').classList.toggle('off', !sin);
  showCos.closest('.control-item').classList.toggle('off', !cos);
  showTan.closest('.control-item').classList.toggle('off', !tan);

  draw();
}

showSin.addEventListener('change', updateVisibility);
showCos.addEventListener('change', updateVisibility);
showTan.addEventListener('change', updateVisibility);

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const sin = showSin.checked;
  const cos = showCos.checked;
  const tan = showTan.checked;

  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);
  const tanA = Math.tan(angle);
  const px = cx + radius * cosA;
  const py = cy - radius * sinA;
  const bx = cx + radius * cosA;
  const by = cy;

  // Unit circle
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Axes
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(30, cy);
  ctx.lineTo(360, cy);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, 30);
  ctx.lineTo(cx, 370);
  ctx.stroke();

  // Axis ticks
  ctx.fillStyle = '#bbb';
  ctx.font = '10px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('1', cx + radius, cy + 14);
  ctx.fillText('-1', cx - radius, cy + 14);
  ctx.textAlign = 'right';
  ctx.fillText('1', cx - 6, cy - radius + 4);
  ctx.fillText('-1', cx - 6, cy + radius + 4);

  // Angle arc
  const arcR = 30;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, arcR, 0, -angle, angle > 0);
  ctx.closePath();
  ctx.fillStyle = 'rgba(124, 58, 237, 0.08)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, arcR, 0, -angle, angle > 0);
  ctx.strokeStyle = 'rgba(124, 58, 237, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Angle label
  const degVal = (angle * 180 / Math.PI);
  const labelAngle = -angle / 2;
  ctx.fillStyle = '#7c3aed';
  ctx.font = '11px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(degVal.toFixed(0) + '°', cx + (arcR + 14) * Math.cos(labelAngle), cy + (arcR + 14) * Math.sin(labelAngle) + 3);

  // Hypotenuse (always visible)
  ctx.strokeStyle = COLOR_HYP;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(px, py);
  ctx.stroke();

  // Adjacent - horizontal
  if (cos || tan) {
    ctx.strokeStyle = COLOR_ADJ;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(bx, by);
    ctx.stroke();

    ctx.font = 'bold 11px Segoe UI';
    ctx.fillStyle = COLOR_ADJ;
    ctx.textAlign = 'center';
    const adjLabelY = cosA >= 0 ? cy + 16 : cy - 8;
    if (cos) {
      ctx.fillText('cos θ = ' + cosA.toFixed(3), (cx + bx) / 2, adjLabelY);
    } else {
      ctx.fillText('밑변', (cx + bx) / 2, adjLabelY);
    }
  }

  // Opposite - vertical
  if (sin || tan) {
    ctx.strokeStyle = COLOR_OPP;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(px, py);
    ctx.stroke();

    ctx.font = 'bold 11px Segoe UI';
    ctx.fillStyle = COLOR_OPP;
    const oppLabelX = cosA >= 0 ? bx + 12 : bx - 12;
    ctx.textAlign = cosA >= 0 ? 'left' : 'right';
    if (sin) {
      ctx.fillText('sin θ = ' + sinA.toFixed(3), oppLabelX, (by + py) / 2 + 4);
    } else {
      ctx.fillText('높이', oppLabelX, (by + py) / 2 + 4);
    }
  }

  // Right angle marker
  if ((sin || tan) && (cos || tan)) {
    const rmSize = 8;
    const rmDirX = cosA > 0 ? -1 : 1;
    const rmDirY = sinA > 0 ? 1 : -1;
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(bx + rmDirX * rmSize, by);
    ctx.lineTo(bx + rmDirX * rmSize, by + rmDirY * rmSize);
    ctx.lineTo(bx, by + rmDirY * rmSize);
    ctx.stroke();
  }

  // Draggable point
  ctx.beginPath();
  ctx.arc(px, py, 10, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = COLOR_HYP;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Origin
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#999';
  ctx.fill();

  // Update panel values
  const deg = angle * 180 / Math.PI;
  document.getElementById('angleDeg').textContent = deg.toFixed(1) + '°';
  document.getElementById('angleRad').textContent = angle.toFixed(3) + ' rad';
  document.getElementById('sinVal').textContent = sinA.toFixed(3);
  document.getElementById('cosVal').textContent = cosA.toFixed(3);
  document.getElementById('tanVal').textContent = Math.abs(tanA) > 999 ? '∞' : tanA.toFixed(3);

  const opp = (sinA * radius).toFixed(0);
  const adj = (cosA * radius).toFixed(0);
  document.getElementById('sinRatio').textContent = `${Math.abs(opp)} / ${radius} = ${sinA.toFixed(3)}`;
  document.getElementById('cosRatio').textContent = `${Math.abs(adj)} / ${radius} = ${cosA.toFixed(3)}`;
  document.getElementById('tanRatio').textContent = Math.abs(cosA) < 0.01 ? '정의 안 됨 (밑변 = 0)' : `${Math.abs(opp)} / ${Math.abs(adj)} = ${tanA.toFixed(3)}`;

  // Update bars
  updateBar('sinBar', 'sinBarVal', sinA);
  updateBar('cosBar', 'cosBarVal', cosA);
  updateTanBar(tanA);
}

function updateBar(barId, valId, value) {
  const bar = document.getElementById(barId);
  const pct = Math.abs(value) * 50;
  if (value >= 0) {
    bar.style.left = '50%';
    bar.style.width = pct + '%';
  } else {
    bar.style.left = (50 - pct) + '%';
    bar.style.width = pct + '%';
  }
  document.getElementById(valId).textContent = value.toFixed(3);
}

function updateTanBar(value) {
  const bar = document.getElementById('tanBar');
  const valEl = document.getElementById('tanBarVal');
  if (Math.abs(value) > 10) {
    bar.style.width = '50%';
    bar.style.left = value > 0 ? '50%' : '0%';
    valEl.textContent = Math.abs(value) > 999 ? '∞' : value.toFixed(1);
    return;
  }
  const pct = Math.min(Math.abs(value) / 2 * 50, 50);
  if (value >= 0) {
    bar.style.left = '50%';
    bar.style.width = pct + '%';
  } else {
    bar.style.left = (50 - pct) + '%';
    bar.style.width = pct + '%';
  }
  valEl.textContent = value.toFixed(3);
}

function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

canvas.addEventListener('mousedown', (e) => {
  const m = getMousePos(e);
  const px = cx + radius * Math.cos(angle);
  const py = cy - radius * Math.sin(angle);
  if (Math.sqrt((m.x-px)**2 + (m.y-py)**2) < 20) dragging = true;
});
canvas.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const m = getMousePos(e);
  angle = -Math.atan2(m.y - cy, m.x - cx);
  if (angle < 0) angle += Math.PI * 2;
  draw();
});
canvas.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('mouseleave', () => { dragging = false; });

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0], rect = canvas.getBoundingClientRect();
  const m = { x: (t.clientX - rect.left) * (canvas.width / rect.width), y: (t.clientY - rect.top) * (canvas.height / rect.height) };
  const px = cx + radius * Math.cos(angle);
  const py = cy - radius * Math.sin(angle);
  if (Math.sqrt((m.x-px)**2 + (m.y-py)**2) < 30) dragging = true;
});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!dragging) return;
  const t = e.touches[0], rect = canvas.getBoundingClientRect();
  const m = { x: (t.clientX - rect.left) * (canvas.width / rect.width), y: (t.clientY - rect.top) * (canvas.height / rect.height) };
  angle = -Math.atan2(m.y - cy, m.x - cx);
  if (angle < 0) angle += Math.PI * 2;
  draw();
});
canvas.addEventListener('touchend', () => { dragging = false; });

draw();
</script>
</body>
</html>
